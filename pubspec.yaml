name: alexandria
description: "Alexandria — a minimal, industrial reader for PDF, EPUB and DOCX."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  omni_ai: ^0.8.0
  pdfrx: ^2.10.1
  archive: ^4.0.0
  xml: ^6.5.0
  html: ^0.15.7
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  screen_brightness: ^2.1.11
  share_plus: ^13.3.1
  http: ^1.6.0
  google_fonts: ^9.0.0
  super_sliver_list: ^0.4.1
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  wakelock_plus: ^1.8.2
  flutter_tts: ^4.2.5
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  min_sdk_android: 21
