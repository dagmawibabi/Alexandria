<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// A saved accent is applied before the first paint, so buttons don't fade over from orange.
			try {
				const a = JSON.parse(localStorage.getItem('accentColours'));
				if (a) {
					document.documentElement.style.setProperty('--signal', a[0]);
					document.documentElement.style.setProperty('--on-signal', a[1]);
				}
			} catch (e) {
				/* no saved accent */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
